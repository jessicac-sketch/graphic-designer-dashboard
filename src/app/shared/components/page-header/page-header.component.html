<header class="page-header">
    <div class="page-header__heading">
        <span class="page-header__eyebrow">{{ eyebrow() }}</span>
        <h1 class="page-header__title">
            {{ title() }}
        </h1>
        @if (subtitle()) {
            <p class="page-header__subtitle" [title]="subtitle()">{{ subtitle() }}</p>
        }
        <!-- Optional content under the description, e.g. a total: <p page-header-meta>…</p> -->
        <ng-content select="[page-header-meta]" />
    </div>

    <div class="page-header__actions">
        <ng-content />
    </div>
</header>
