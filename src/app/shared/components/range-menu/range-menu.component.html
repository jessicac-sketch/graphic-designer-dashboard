<button
    #trigger
    type="button"
    class="range-menu"
    [class.range-menu--compact]="compact()"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    data-testid="range-menu"
    (click)="menu.toggle($event, trigger)">
    <i class="range-menu__icon fa-sharp fa-regular fa-calendar" aria-hidden="true"></i>
    <span class="range-menu__label">{{ rangeService().activeOption().label }}</span>
    <span class="range-menu__dates">{{ rangeService().activeOption().dates }}</span>
    <i
        class="range-menu__chevron fa-sharp fa-regular fa-chevron-down"
        [class.range-menu__chevron--open]="isOpen()"
        aria-hidden="true"></i>
</button>

<ntv-popover
    #menu
    trigger="click"
    [placement]="placement()"
    minWidth="280px"
    [arrow]="false"
    (shown)="isOpen.set(true)"
    (hidden)="isOpen.set(false)">
    <div class="range-menu__panel" role="menu" aria-label="Date range">
        @for (option of options(); track option.value) {
            <button
                type="button"
                class="range-menu__item"
                [class.range-menu__item--active]="option.value === rangeService().activePreset()"
                role="menuitemradio"
                [attr.aria-checked]="option.value === rangeService().activePreset()"
                [disabled]="option.value === 'custom'"
                [attr.data-testid]="'range-menu-' + option.value"
                (click)="select(option.value)">
                <span class="range-menu__item-label">{{ option.label }}</span>
                <span class="range-menu__item-dates">{{ option.dates }}</span>
            </button>
        }
    </div>
</ntv-popover>
