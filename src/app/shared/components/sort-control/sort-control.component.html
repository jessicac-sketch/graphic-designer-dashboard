<div class="sort-control" role="radiogroup" [attr.aria-label]="label()">
    <span class="sort-control__label" [title]="label()">
        <i class="fa-sharp fa-regular fa-{{ icon() }}" aria-hidden="true"></i>
    </span>
    @for (option of options(); track option.value) {
        @let isActive = value() === option.value;
        <button
            type="button"
            role="radio"
            class="sort-control__option"
            [class.sort-control__option--active]="isActive"
            [attr.aria-checked]="isActive"
            [title]="
                isActive && direction()
                    ? (direction() === 'desc' ? 'Most first' : 'Fewest first') +
                      ' - click to reverse'
                    : ''
            "
            (click)="select(option.value)">
            {{ option.label }}
            @if (isActive && direction(); as dir) {
                <i
                    class="sort-control__direction fa-sharp fa-regular"
                    [class.fa-arrow-down]="dir === 'desc'"
                    [class.fa-arrow-up]="dir === 'asc'"
                    aria-hidden="true"></i>
            }
        </button>
    }
</div>
